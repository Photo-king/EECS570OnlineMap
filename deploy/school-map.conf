# Independent EECS570 demo. Existing domain virtual hosts remain unchanged.
server {
    listen 80;
    server_name map.solvaneon.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://map.solvaneon.com$request_uri;
    }
}
server {
    listen 80;
    server_name 118.31.225.213;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    root /var/www/school-map/current;
    index index.html;
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
server {
    listen 443 ssl http2;
    server_name map.solvaneon.com;
    ssl_certificate /etc/nginx/ssl/map.solvaneon.com.crt;
    ssl_certificate_key /etc/nginx/ssl/map.solvaneon.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    root /var/www/school-map/current;
    index index.html;
    access_log /var/log/nginx/school-map.access.log main;
    error_log /var/log/nginx/school-map.error.log warn;
    server_tokens off;
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
